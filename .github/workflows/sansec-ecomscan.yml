name: Sansec eComscan Security Scan

# The same scan as the other Mage-OS modules. It needs the SANSEC_LICENSE_KEY secret (a Mage-OS org secret).
#
# pull_request_target, so the scan of a PR from a fork has the secret too. It checks out the PR's code but never
# runs it: only the downloaded eComscan binary runs, reading the files, with a read-only token.
on:
  push:
  pull_request_target:
  workflow_dispatch:

jobs:
  run-ecomscan:
    # Skip if it's a push event on a PR (it can't access secrets)
    if: github.event.pull_request == null || github.event_name != 'push'
    name: Run Sansec eComscan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Download eComscan
        run: wget https://ecomscan.com/downloads/linux-amd64/ecomscan

      - name: Fix permissions
        run: chmod +x ecomscan

      - name: Run eComscan
        env:
          ECOMSCAN_KEY: ${{ secrets.SANSEC_LICENSE_KEY }}
          ECOMSCAN_SKIP_SERVER_CHECKS: 1
        run: |
          output=$(./ecomscan --no-auto-update --skip-database --deep --format=csv .)
          if [ -n "$output" ]; then
            echo "Security issues found:"
            echo "$output"
            exit 1
          fi
